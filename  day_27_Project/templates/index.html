<!DOCTYPE html>
<html>
<head>
    <title>Hacker News 搜索器 🔍</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        tr:hover { background-color: #f1f1f1; }
        .stats { color: #666; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hacker News 数据库</h1>

        <form method="POST" action="/">
            <input type="text" name="keyword" placeholder="输入关键词 (例如: Python, Google, AI)..." value="{{ keyword }}">
            <button type="submit">搜索</button>
        </form>

        {% if news_list %}
            <p class="stats">找到 {{ count }} 条结果：</p>
            <table>
                <thead>
                    <tr>
                        <th>标题 (Title)</th>
                        <th>链接 (Link)</th>
                        <th>评论数</th>
                    </tr>
                </thead>
                <tbody>
                    {% for news in news_list %}
                    <tr>
                        <td>{{ news['title'] }}</td>
                        <td><a href="{{ news['url'] }}" target="_blank">点击查看</a></td>
                        <td>{{ news['num_comments'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p style="margin-top: 20px; color: red;">没有找到相关新闻，或者还未开始搜索。</p>
        {% endif %}
    </div>
</body>
</html>
